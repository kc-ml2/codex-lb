# Production Docker Compose — PostgreSQL backend
# Usage:
#   cp .env.example .env.local   # fill in secrets
#   docker compose -f docker-compose.prod.yml up -d
#
# Requires external PostgreSQL. Set CODEX_LB_DATABASE_URL in .env.local:
#   CODEX_LB_DATABASE_URL=postgresql+asyncpg://user:password@host:5432/codexlb
#
# NOTE: This Compose file defines a SINGLE-REPLICA topology.
# Do not use `docker compose up --scale server=N` — the published host ports collide
# and Compose provides no per-replica bridge identity. Multi-replica deployments
# require the Helm chart with PostgreSQL and leader election (deploy/helm/codex-lb).
services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.local
    ports:
      - "2455:2455"
      - "1455:1455"
    volumes:
      - codex-lb-data:/var/lib/codex-lb
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:2455/health/ready')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  server-dev:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: Dockerfile
    image: codex-lb-dev-server:latest
    pull_policy: build
    env_file:
      - .env.dev.local
    ports:
      - "1456:1455"
      - "2456:2455"
    command:
      - python
      - -m
      - app.cli
      - --host
      - 0.0.0.0
      - --port
      - "2455"
      - --ws-max-size
      - "134217728"
    volumes:
      - codex-lb-dev-data:/var/lib/codex-lb
    develop:
      watch:
        - action: sync+restart
          path: ./app
          target: /app/app
        - action: rebuild
          path: ./pyproject.toml
        - action: rebuild
          path: ./uv.lock
        - action: rebuild
          path: ./Dockerfile
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:2455/health/ready')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  frontend-dev:
    profiles: ["dev"]
    build:
      context: ./frontend
      dockerfile_inline: |
        FROM oven/bun:1.4.2-alpine
        WORKDIR /app
        COPY package.json bun.lock ./
        RUN bun install --frozen-lockfile
        COPY . .
        CMD ["bun", "run", "dev", "--host", "0.0.0.0"]
    image: codex-lb-dev-frontend:latest
    pull_policy: build
    ports:
      - "5174:5173"
    environment:
      API_PROXY_TARGET: http://server-dev:2455
    depends_on:
      server-dev:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: ./frontend
          target: /app
          ignore:
            - node_modules/
        - action: rebuild
          path: ./frontend/package.json
        - action: rebuild
          path: ./frontend/bun.lock
    restart: unless-stopped

networks:
  default:
    driver: bridge

volumes:
  codex-lb-data:
    name: codex-lb-data
  codex-lb-dev-data:
    name: codex-lb-dev-data
